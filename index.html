<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6C6C6C"><title>Mexican Spanish Flashcards</title><style>
:root{--bg:#6C6C6C;--surface:#f4f5f6;--surface-strong:#fff;--text:#111827;--muted:#374151;--border:#c5cbd3;--accent-dark:#183a5a;--again:#ffd9d9;--hard:#ffe8c2;--good:#d9f3df;--easy:#dcecff}*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);padding:28px 18px 44px}main{width:100%;max-width:780px;margin:0 auto}h1{text-align:center;margin:0 0 6px;color:#fff;font-size:clamp(2.05rem,5vw,2.8rem);font-weight:850;letter-spacing:-.03em}.subtitle{text-align:center;margin:0 0 22px;color:#f3f4f6;font-weight:650}.toolbar,.study-shell{background:var(--surface);border:1px solid #11182728;border-radius:18px;box-shadow:0 8px 22px #11182721}.toolbar{padding:16px;margin-bottom:16px}.field{display:grid;gap:6px}label{font-weight:750;font-size:.9rem}select{width:100%;min-height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface-strong);color:var(--text);padding:10px 12px;font-size:1rem}button{min-height:44px;border:1px solid var(--border);border-radius:10px;padding:10px 14px;background:var(--surface-strong);color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s}button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px #11182721}button:focus-visible,select:focus-visible{outline:3px solid #80bfff;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.52}.deck-meta{margin:0;color:var(--muted);font-size:.9rem}.study-shell{padding:20px}#progress{text-align:center;color:var(--muted);font-weight:750;min-height:24px;margin:0 0 16px}.card{background:var(--surface-strong);border:1px solid var(--border);border-radius:20px;width:100%;height:460px;max-height:520px;padding:38px 28px;display:flex;justify-content:center;align-items:center;text-align:center;cursor:pointer;overflow:hidden}.card:focus-visible{outline:3px solid #80bfff;outline-offset:3px}.card-inner{width:100%;height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;justify-items:center}.card-label{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:850;color:#000}.content{width:100%;min-height:0;display:grid;gap:16px;justify-items:center;align-content:center;overflow-y:auto;overflow-x:hidden;padding:8px 10px}.content[hidden]{display:none!important}.front-text{font-size:clamp(1.55rem,4vw,2.45rem);font-weight:800;line-height:1.22;overflow-wrap:anywhere;color:#000}.answer{font-size:clamp(1.8rem,4.7vw,2.75rem);font-weight:850;line-height:1.18;overflow-wrap:anywhere;color:#000}.example-es{font-size:clamp(1.05rem,2.8vw,1.4rem);font-weight:650;line-height:1.38;overflow-wrap:anywhere;color:#1f2937}.example-en{font-size:clamp(.92rem,2.4vw,1.1rem);font-weight:500;line-height:1.4;overflow-wrap:anywhere;color:#6b7280;font-style:italic}.reveal-note{text-align:center;color:var(--muted);font-size:.88rem;font-weight:650;margin:10px 0 0}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.grade{color:#000;border-width:2px}.grade small{display:block;font-size:.72rem;font-weight:650;margin-top:2px}.again{background:var(--again);border-color:#e3a5a5}.hard{background:var(--hard);border-color:#e4bb75}.good{background:var(--good);border-color:#98cda3}.easy{background:var(--easy);border-color:#9dbde6}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.empty{background:var(--surface-strong);border:1px dashed var(--border);border-radius:14px;text-align:center;padding:40px 20px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:1.15rem;margin-bottom:6px}.status{min-height:20px;color:#9f2525;font-weight:650;text-align:center;margin:10px 0 0}@media(max-width:560px){body{padding:20px 12px 34px}.study-shell{padding:13px}.card{height:400px;padding:30px 18px}.buttons{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><h1>Mexican Spanish Flashcards</h1><p class="subtitle">Active Spanish production with spaced repetition</p><section class="toolbar"><div class="field"><label for="deckSelect">Current deck</label><select id="deckSelect"></select><p id="deckMeta" class="deck-meta"></p></div></section><section class="study-shell"><div id="progress"></div><div id="emptyState" class="empty"><strong>No cards are due</strong><span id="emptyMessage">Your next review will appear here.</span></div><div id="card" class="card" role="button" tabindex="0" aria-label="Card, tap to reveal" hidden><div class="card-inner"><div id="sideLabel" class="card-label">Front</div><div id="front" class="content"></div><div id="back" class="content" hidden></div></div></div><p id="revealNote" class="reveal-note" hidden>Tap the card to reveal the answer</p><div class="buttons"><button class="grade again" data-grade="1" disabled>Again<small>I forgot</small></button><button class="grade hard" data-grade="2" disabled>Hard<small>Difficult</small></button><button class="grade good" data-grade="3" disabled>Good<small>Good</small></button><button class="grade easy" data-grade="4" disabled>Easy<small>Easy</small></button></div><div class="nav"><button id="previousButton" disabled>◀ Previous</button><button id="nextButton" disabled>Next ▶</button></div><p id="status" class="status" role="status"></p></section></main>
<script src="vendor/ts-fsrs-5.4.1.umd.js"></script><script src="data/decks.js"></script><script>
"use strict";
const DB_NAME="mexican-spanish-flashcards-db",DB_VERSION=1,SELECTED_DECK_KEY="mexican-spanish-flashcards-deck-id",TS_FSRS_VERSION="ts-fsrs@5.4.1",CONTENT=window.MEXICAN_SPANISH_CONTENT;
const fsrsScheduler=window.FSRS.fsrs(),FsrsRating=window.FSRS.Rating,FsrsState=window.FSRS.State,MAX_TIMER_DELAY=2147483647;
let db,deck=null,progressByDeck=new Map(),currentCardId=null,studyQueue=[],showing=false,dueTimer=null;
const $=id=>document.getElementById(id),deckSelect=$("deckSelect"),deckMeta=$("deckMeta"),progress=$("progress"),emptyState=$("emptyState"),emptyMessage=$("emptyMessage"),cardEl=$("card"),front=$("front"),back=$("back"),sideLabel=$("sideLabel"),revealNote=$("revealNote"),gradeButtons=[...document.querySelectorAll(".grade")];
function openDatabase(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("deckProgress"))r.result.createObjectStore("deckProgress",{keyPath:"deckId"});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}function store(mode="readonly"){return db.transaction("deckProgress",mode).objectStore("deckProgress");}function getAllProgress(){return new Promise((resolve,reject)=>{const r=store().getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}function saveProgress(value){return new Promise((resolve,reject)=>{const r=store("readwrite").put(value);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error);});}function emptyFsrsState(){return window.FSRS.createEmptyCard(new Date());}
async function syncCanonicalContent(){const changed=[];for(const canonical of CONTENT.decks){let local=progressByDeck.get(canonical.id),dirty=false;if(!local){local={deckId:canonical.id,contentVersion:CONTENT.version,schedulerVersion:TS_FSRS_VERSION,cards:{}};progressByDeck.set(canonical.id,local);dirty=true;}if(local.schedulerVersion!==TS_FSRS_VERSION){local.cards={};local.schedulerVersion=TS_FSRS_VERSION;dirty=true;}for(const card of canonical.cards)if(!local.cards[card.id]){local.cards[card.id]=emptyFsrsState();dirty=true;}if(local.contentVersion!==CONTENT.version){local.contentVersion=CONTENT.version;dirty=true;}if(dirty){local.updatedAt=Date.now();changed.push(local);}}await Promise.all(changed.map(saveProgress));}
function deckProgress(){return progressByDeck.get(deck.id);}function fsrsFor(card){return deckProgress().cards[card.id];}function schedulerCard(card){const state=fsrsFor(card)||emptyFsrsState();return {...state,due:state.due?new Date(state.due):new Date(),last_review:state.last_review?new Date(state.last_review):undefined};}function isDue(card,now=Date.now()){const due=new Date(fsrsFor(card)?.due).getTime();return !Number.isFinite(due)||due<=now;}function cardById(id){return deck?.cards.find(card=>card.id===id)||null;}function clearDueTimer(){if(dueTimer!==null){clearTimeout(dueTimer);dueTimer=null;}}function nextDueAt(now=Date.now()){return deck?.cards.map(card=>new Date(fsrsFor(card)?.due).getTime()).filter(due=>Number.isFinite(due)&&due>now).sort((a,b)=>a-b)[0]||null;}
function scheduleNextDueCheck(){clearDueTimer();if(!deck||studyQueue.length)return;const dueAt=nextDueAt();if(!dueAt)return;dueTimer=setTimeout(()=>{dueTimer=null;rebuildQueue();},Math.min(Math.max(dueAt-Date.now(),0),MAX_TIMER_DELAY));}function rebuildQueue(){clearDueTimer();if(!deck){studyQueue=[];currentCardId=null;render();return;}studyQueue=deck.cards.filter(card=>isDue(card)).sort((a,b)=>{const rank=card=>{const s=fsrsFor(card).state;return s===FsrsState.New?0:(s===FsrsState.Learning||s===FsrsState.Relearning?1:2);};return rank(a)-rank(b)||new Date(fsrsFor(a).due)-new Date(fsrsFor(b).due);}).map(card=>card.id);if(!studyQueue.includes(currentCardId))currentCardId=studyQueue[0]||null;render();scheduleNextDueCheck();}function nextDueText(){const due=nextDueAt();return due?`No cards are due · next review ${new Date(due).toLocaleString()}`:"No cards are due";}
function render(){const current=cardById(currentCardId);if(!deck){progress.textContent="";emptyState.hidden=false;cardEl.hidden=true;revealNote.hidden=true;updateButtons(false);return;}deckMeta.textContent=`${deck.cards.length} cards · progress is saved on this device`;progress.textContent=studyQueue.length?`${Math.max(1,studyQueue.indexOf(currentCardId)+1)} / ${studyQueue.length} · ${fsrsFor(current).state===FsrsState.New?"New":"Due"}`:nextDueText();emptyMessage.textContent=nextDueText();if(!current){emptyState.hidden=false;cardEl.hidden=true;revealNote.hidden=true;updateButtons(false);return;}emptyState.hidden=true;cardEl.hidden=false;revealNote.hidden=showing;updateButtons(showing);sideLabel.textContent=showing?"Answer":"Prompt";front.hidden=showing;back.hidden=!showing;(showing?renderBack:renderFront)(showing?back:front,current);}function renderFront(container,card){container.replaceChildren();const text=document.createElement("div");text.className="front-text";text.textContent=card.front;container.append(text);}function renderBack(container,card){container.replaceChildren();for(const [className,textValue] of [["answer",card.back.answer],["example-es",card.back.exampleEs],["example-en",card.back.exampleEn]]){const el=document.createElement("div");el.className=className;el.textContent=textValue;container.append(el);}}
function updateButtons(enabled){gradeButtons.forEach(button=>button.disabled=!enabled);$("previousButton").disabled=!deck||!studyQueue.length;$("nextButton").disabled=!deck||!studyQueue.length;}function renderDeckSelector(){deckSelect.replaceChildren();CONTENT.decks.forEach(item=>deckSelect.add(new Option(item.title,item.id)));deckSelect.value=deck?.id||CONTENT.decks[0].id;}function selectDeck(id){deck=CONTENT.decks.find(item=>item.id===id)||CONTENT.decks[0];currentCardId=null;showing=false;localStorage.setItem(SELECTED_DECK_KEY,deck.id);renderDeckSelector();rebuildQueue();}function reveal(){if(cardById(currentCardId)){showing=!showing;render();}}function next(){if(!studyQueue.length)return;const i=studyQueue.indexOf(currentCardId);currentCardId=studyQueue[(i+1)%studyQueue.length];showing=false;render();}function previous(){if(!studyQueue.length)return;const i=studyQueue.indexOf(currentCardId);currentCardId=studyQueue[(i-1+studyQueue.length)%studyQueue.length];showing=false;render();}
async function grade(rating){const current=cardById(currentCardId);if(!current||!showing)return;const ratings={1:FsrsRating.Again,2:FsrsRating.Hard,3:FsrsRating.Good,4:FsrsRating.Easy};deckProgress().cards[current.id]=fsrsScheduler.next(schedulerCard(current),new Date(),ratings[rating]).card;deckProgress().updatedAt=Date.now();await saveProgress(deckProgress());showing=false;currentCardId=null;rebuildQueue();}
deckSelect.addEventListener("change",()=>selectDeck(deckSelect.value));cardEl.addEventListener("click",reveal);cardEl.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="Enter"){e.preventDefault();reveal();}});$("nextButton").addEventListener("click",next);$("previousButton").addEventListener("click",previous);gradeButtons.forEach(button=>button.addEventListener("click",()=>grade(Number(button.dataset.grade))));document.addEventListener("keydown",e=>{if(e.target.matches("select,button"))return;if(e.code==="Space"){e.preventDefault();reveal();}if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")previous();});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")rebuildQueue();});window.addEventListener("pageshow",rebuildQueue);
async function init(){try{if(!CONTENT||CONTENT.decks.length!==9)throw new Error("The built-in deck data is invalid.");db=await openDatabase();progressByDeck=new Map((await getAllProgress()).map(item=>[item.deckId,item]));await syncCanonicalContent();const preferred=localStorage.getItem(SELECTED_DECK_KEY);selectDeck(progressByDeck.has(preferred)?preferred:CONTENT.decks[0].id);}catch(error){console.error(error);$("status").textContent="Local storage could not be opened. Please check your browser settings.";}}init();
</script></body></html>
