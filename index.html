<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F5132"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Spanish Flashcards"><title>Mexican Spanish Flashcards</title><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><style>
:root{
  --color-bg:#F8F6ED;--color-surface:#FFFEFA;--color-surface-soft:#F2EFE4;
  --color-text:#183126;--color-muted:#66756D;--color-border:#D9DED7;
  --color-green:#0F5132;--color-green-dark:#093C25;--color-green-soft:#E7F0EA;
  --color-red:#D62828;--color-focus:#2D76C5;
  --again-bg:#FDE8E7;--again-border:#E7A9A5;--again-text:#8A2826;
  --hard-bg:#FFF2D9;--hard-border:#E2C27F;--hard-text:#74531B;
  --good-bg:#E5F3E9;--good-border:#9BC7A6;--good-text:#245C32;
  --easy-bg:#E6EFF5;--easy-border:#9EBACB;--easy-text:#28566D;
  --radius-sm:10px;--radius-md:14px;--radius-lg:20px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;
  --shadow-soft:0 8px 24px rgba(30,58,43,.08);--shadow-card:0 14px 34px rgba(30,58,43,.12);
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--color-bg)}
body{margin:0;min-height:100vh;background:var(--color-bg);color:var(--color-text);padding:var(--space-5) 18px 40px;font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
main{width:100%;max-width:780px;margin:0 auto}
.app-header{display:flex;align-items:center;justify-content:center;gap:var(--space-3);margin:0 0 var(--space-4)}
.brand-mark{width:58px;height:58px;flex:none;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(15,81,50,.14))}
.brand-copy{min-width:0}
h1{margin:0;color:var(--color-green-dark);font-size:clamp(1.55rem,3.5vw,2rem);font-weight:820;line-height:1.08;letter-spacing:-.035em}
.subtitle{margin:var(--space-1) 0 0;color:var(--color-muted);font-size:.9rem;font-weight:570;line-height:1.3}
.toolbar,.study-shell{background:var(--color-surface);border:1px solid var(--color-border);box-shadow:var(--shadow-soft)}
.toolbar{padding:var(--space-3) var(--space-4);margin-bottom:var(--space-3);border-radius:var(--radius-md)}
.field{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:var(--space-2) var(--space-3)}
label{font-size:.78rem;font-weight:800;letter-spacing:.075em;text-transform:uppercase;color:var(--color-green)}
select{width:100%;min-height:42px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text);padding:8px 38px 8px 12px;font:600 .96rem/1.2 var(--font-sans)}
button{min-height:46px;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:9px 14px;background:var(--color-surface);color:var(--color-text);font:750 .96rem/1.15 var(--font-sans);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 14px rgba(30,58,43,.1)}
button:active:not(:disabled){transform:translateY(0)}
button:focus-visible,select:focus-visible,.card:focus-visible{outline:3px solid var(--color-focus);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.48}
.deck-meta{grid-column:2;margin:-2px 0 0;color:var(--color-muted);font-size:.78rem;line-height:1.3}
.study-shell{padding:var(--space-4);border-radius:var(--radius-lg)}
.progress-row{display:grid;grid-template-columns:auto minmax(80px,1fr) auto;align-items:center;gap:var(--space-3);min-height:24px;margin:0 2px var(--space-3);color:var(--color-muted);font-size:.82rem;font-weight:750}
.progress-count{color:var(--color-text);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress-track{height:5px;overflow:hidden;border-radius:999px;background:var(--color-surface-soft)}
.progress-fill{display:block;width:0;height:100%;border-radius:inherit;background:var(--color-red);transition:width .18s ease}
.progress-state{padding:3px 8px;border-radius:999px;background:var(--color-green-soft);color:var(--color-green);font-size:.7rem;font-weight:850;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.progress-row.is-message{display:block;text-align:center;line-height:1.45}
.progress-row.is-message .progress-track,.progress-row.is-message .progress-state{display:none}
.card{width:100%;height:460px;max-height:520px;display:flex;justify-content:center;align-items:center;overflow:hidden;padding:34px 28px;background:var(--color-surface);border:1px solid #CDD7D0;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);text-align:center;cursor:pointer}
.card-inner{width:100%;height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-3);justify-items:center}
.card-label{padding:5px 10px;border:1px solid #C7D9CD;border-radius:999px;background:var(--color-green-soft);color:var(--color-green);font-size:.67rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}
.content{width:100%;min-height:0;display:grid;gap:var(--space-4);justify-items:center;align-content:center;overflow-y:auto;overflow-x:hidden;padding:8px 10px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.content[hidden]{display:none!important}
.content img{display:block;max-width:100%;max-height:100%;height:auto;object-fit:contain;border-radius:var(--radius-sm)}
.front-text{color:#10251A;font-size:clamp(1.55rem,4vw,2.45rem);font-weight:790;line-height:1.22;overflow-wrap:anywhere}
.answer{color:var(--color-green-dark);font-size:clamp(1.8rem,4.7vw,2.75rem);font-weight:840;line-height:1.18;overflow-wrap:anywhere}
.example-es{color:#294238;font-size:clamp(1.05rem,2.8vw,1.4rem);font-weight:640;line-height:1.38;overflow-wrap:anywhere}
.example-en{color:var(--color-muted);font-size:clamp(.92rem,2.4vw,1.1rem);font-weight:500;line-height:1.4;overflow-wrap:anywhere;font-style:italic}
.reveal-note{min-height:18px;margin:9px 0 0;text-align:center;color:var(--color-muted);font-size:.8rem;font-weight:620}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2);margin-top:var(--space-3)}
.grade{border-width:1px;font-size:.98rem;box-shadow:0 2px 5px rgba(30,58,43,.04)}
.grade small{display:block;margin-top:3px;font-size:.68rem;font-weight:620;opacity:.82}
.again{background:var(--again-bg);border-color:var(--again-border);color:var(--again-text)}
.hard{background:var(--hard-bg);border-color:var(--hard-border);color:var(--hard-text)}
.good{background:var(--good-bg);border-color:var(--good-border);color:var(--good-text)}
.easy{background:var(--easy-bg);border-color:var(--easy-border);color:var(--easy-text)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-2)}
.nav button{min-height:42px;background:transparent;border-color:transparent;color:var(--color-muted);font-size:.86rem;box-shadow:none}
.nav button:hover:not(:disabled){background:var(--color-surface-soft);border-color:var(--color-border);box-shadow:none}
.empty{padding:40px 20px;background:var(--color-surface);border:1px dashed var(--color-border);border-radius:var(--radius-md);text-align:center;color:var(--color-muted)}
.empty strong{display:block;margin-bottom:6px;color:var(--color-text);font-size:1.15rem}
.status{min-height:20px;margin:8px 0 0;color:#9B2C2C;font-size:.88rem;font-weight:650;text-align:center}
@media(max-width:560px){
  body{padding:10px 12px calc(26px + env(safe-area-inset-bottom))}
  .app-header{justify-content:flex-start;gap:10px;margin-bottom:10px;padding:0 2px}
  .brand-mark{width:46px;height:46px}
  h1{font-size:clamp(1.1rem,5.25vw,1.4rem);line-height:1.05}
  .subtitle{margin-top:2px;font-size:.68rem;letter-spacing:-.01em;white-space:nowrap}
  .toolbar{padding:9px 10px;margin-bottom:8px}
  .field{grid-template-columns:1fr;gap:5px}
  .field label{font-size:.68rem}
  select{min-height:40px;padding-top:7px;padding-bottom:7px;font-size:.9rem}
  .deck-meta{grid-column:1;margin:0;font-size:.7rem}
  .study-shell{padding:10px;border-radius:16px}
  .progress-row{gap:9px;margin:0 1px 9px;font-size:.77rem}
  .card{height:400px;padding:26px 16px}
  .card-inner{gap:10px}
  .buttons{grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
  .grade{min-height:49px;padding:7px 10px}
  .nav{margin-top:6px}
  .nav button{min-height:40px}
}
@media(max-width:360px){
  .subtitle{white-space:normal}
  .card{padding-inline:13px}
}
@media(prefers-reduced-motion:reduce){button,.progress-fill{transition:none}}
</style></head><body><main><header class="app-header"><img class="brand-mark" src="assets/isotype-128.png" width="128" height="128" alt=""><div class="brand-copy"><h1>Mexican Spanish Flashcards</h1><p class="subtitle">Active Spanish production with spaced repetition</p></div></header><section class="toolbar" aria-labelledby="deckLabel"><div class="field"><label id="deckLabel" for="deckSelect">Current deck</label><select id="deckSelect"></select><p id="deckMeta" class="deck-meta"></p></div></section><section class="study-shell"><div id="progress" class="progress-row" aria-live="polite"><span id="progressCount" class="progress-count"></span><span class="progress-track" aria-hidden="true"><span id="progressFill" class="progress-fill"></span></span><span id="progressState" class="progress-state"></span></div><div id="emptyState" class="empty"><strong>No cards are due</strong><span id="emptyMessage">Your next review will appear here.</span></div><div id="card" class="card" role="button" tabindex="0" aria-label="Card, tap to reveal" hidden><div class="card-inner"><div id="sideLabel" class="card-label">English</div><div id="front" class="content"></div><div id="back" class="content" hidden></div></div></div><p id="revealNote" class="reveal-note" hidden>Tap the card to reveal the answer</p><div class="buttons"><button class="grade again" data-grade="1" disabled>Again<small>I forgot</small></button><button class="grade hard" data-grade="2" disabled>Hard<small>Difficult</small></button><button class="grade good" data-grade="3" disabled>Good<small>Good</small></button><button class="grade easy" data-grade="4" disabled>Easy<small>Easy</small></button></div><div class="nav"><button id="previousButton" disabled>◀ Previous</button><button id="nextButton" disabled>Next ▶</button></div><p id="status" class="status" role="status"></p></section></main>
<script src="vendor/ts-fsrs-5.4.1.umd.js"></script><script src="data/decks.js"></script><script>
"use strict";
const DB_NAME="mexican-spanish-flashcards-db",DB_VERSION=1,SELECTED_DECK_KEY="mexican-spanish-flashcards-deck-id",TS_FSRS_VERSION="ts-fsrs@5.4.1",CONTENT=window.MEXICAN_SPANISH_CONTENT;
const fsrsScheduler=window.FSRS.fsrs(),FsrsRating=window.FSRS.Rating,FsrsState=window.FSRS.State,MAX_TIMER_DELAY=2147483647;
let db,deck=null,progressByDeck=new Map(),currentCardId=null,studyQueue=[],showing=false,dueTimer=null;
const $=id=>document.getElementById(id),deckSelect=$("deckSelect"),deckMeta=$("deckMeta"),progress=$("progress"),progressCount=$("progressCount"),progressFill=$("progressFill"),progressState=$("progressState"),emptyState=$("emptyState"),emptyMessage=$("emptyMessage"),cardEl=$("card"),front=$("front"),back=$("back"),sideLabel=$("sideLabel"),revealNote=$("revealNote"),gradeButtons=[...document.querySelectorAll(".grade")];
function openDatabase(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("deckProgress"))r.result.createObjectStore("deckProgress",{keyPath:"deckId"});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}function store(mode="readonly"){return db.transaction("deckProgress",mode).objectStore("deckProgress");}function getAllProgress(){return new Promise((resolve,reject)=>{const r=store().getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}function saveProgress(value){return new Promise((resolve,reject)=>{const r=store("readwrite").put(value);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error);});}function emptyFsrsState(){return window.FSRS.createEmptyCard(new Date());}
async function syncCanonicalContent(){const changed=[];for(const canonical of CONTENT.decks){let local=progressByDeck.get(canonical.id),dirty=false;if(!local){local={deckId:canonical.id,contentVersion:CONTENT.version,schedulerVersion:TS_FSRS_VERSION,cards:{}};progressByDeck.set(canonical.id,local);dirty=true;}if(local.schedulerVersion!==TS_FSRS_VERSION){local.cards={};local.schedulerVersion=TS_FSRS_VERSION;dirty=true;}for(const card of canonical.cards)if(!local.cards[card.id]){local.cards[card.id]=emptyFsrsState();dirty=true;}if(local.contentVersion!==CONTENT.version){local.contentVersion=CONTENT.version;dirty=true;}if(dirty){local.updatedAt=Date.now();changed.push(local);}}await Promise.all(changed.map(saveProgress));}
function deckProgress(){return progressByDeck.get(deck.id);}function fsrsFor(card){return deckProgress().cards[card.id];}function schedulerCard(card){const state=fsrsFor(card)||emptyFsrsState();return {...state,due:state.due?new Date(state.due):new Date(),last_review:state.last_review?new Date(state.last_review):undefined};}function isDue(card,now=Date.now()){const due=new Date(fsrsFor(card)?.due).getTime();return !Number.isFinite(due)||due<=now;}function cardById(id){return deck?.cards.find(card=>card.id===id)||null;}function clearDueTimer(){if(dueTimer!==null){clearTimeout(dueTimer);dueTimer=null;}}function nextDueAt(now=Date.now()){return deck?.cards.map(card=>new Date(fsrsFor(card)?.due).getTime()).filter(due=>Number.isFinite(due)&&due>now).sort((a,b)=>a-b)[0]||null;}
function scheduleNextDueCheck(){clearDueTimer();if(!deck||studyQueue.length)return;const dueAt=nextDueAt();if(!dueAt)return;dueTimer=setTimeout(()=>{dueTimer=null;rebuildQueue();},Math.min(Math.max(dueAt-Date.now(),0),MAX_TIMER_DELAY));}function rebuildQueue(){clearDueTimer();if(!deck){studyQueue=[];currentCardId=null;render();return;}studyQueue=deck.cards.filter(card=>isDue(card)).sort((a,b)=>{const rank=card=>{const s=fsrsFor(card).state;return s===FsrsState.New?0:(s===FsrsState.Learning||s===FsrsState.Relearning?1:2);};return rank(a)-rank(b)||new Date(fsrsFor(a).due)-new Date(fsrsFor(b).due);}).map(card=>card.id);if(!studyQueue.includes(currentCardId))currentCardId=studyQueue[0]||null;render();scheduleNextDueCheck();}function nextDueText(){const due=nextDueAt();return due?`No cards are due · next review ${new Date(due).toLocaleString()}`:"No cards are due";}
function renderProgress(current){if(!deck){progress.classList.add("is-message");progressCount.textContent="";progressState.textContent="";progressFill.style.width="0";progress.removeAttribute("aria-label");return;}if(!studyQueue.length){progress.classList.add("is-message");progressCount.textContent=nextDueText();progressState.textContent="";progressFill.style.width="0";progress.removeAttribute("aria-label");return;}const position=Math.max(1,studyQueue.indexOf(currentCardId)+1),state=fsrsFor(current).state===FsrsState.New?"New":"Due";progress.classList.remove("is-message");progressCount.textContent=`${position} / ${studyQueue.length}`;progressState.textContent=state;progressFill.style.width=`${position/studyQueue.length*100}%`;progress.setAttribute("aria-label",`Card ${position} of ${studyQueue.length}, ${state}`);}function render(){const current=cardById(currentCardId);renderProgress(current);if(!deck){emptyState.hidden=false;cardEl.hidden=true;revealNote.hidden=true;updateButtons(false);return;}deckMeta.textContent=`${deck.cards.length} cards · progress is saved on this device`;emptyMessage.textContent=nextDueText();if(!current){emptyState.hidden=false;cardEl.hidden=true;revealNote.hidden=true;updateButtons(false);return;}emptyState.hidden=true;cardEl.hidden=false;revealNote.hidden=showing;updateButtons(showing);sideLabel.textContent=showing?"Spanish":"English";front.hidden=showing;back.hidden=!showing;(showing?renderBack:renderFront)(showing?back:front,current);}function renderFront(container,card){container.replaceChildren();const text=document.createElement("div");text.className="front-text";text.textContent=card.front;container.append(text);}function renderBack(container,card){container.replaceChildren();for(const [className,textValue] of [["answer",card.back.answer],["example-es",card.back.exampleEs],["example-en",card.back.exampleEn]]){const el=document.createElement("div");el.className=className;el.textContent=textValue;container.append(el);}}
function updateButtons(enabled){gradeButtons.forEach(button=>button.disabled=!enabled);$("previousButton").disabled=!deck||!studyQueue.length;$("nextButton").disabled=!deck||!studyQueue.length;}function renderDeckSelector(){deckSelect.replaceChildren();CONTENT.decks.forEach(item=>deckSelect.add(new Option(item.title,item.id)));deckSelect.value=deck?.id||CONTENT.decks[0].id;}function selectDeck(id){deck=CONTENT.decks.find(item=>item.id===id)||CONTENT.decks[0];currentCardId=null;showing=false;localStorage.setItem(SELECTED_DECK_KEY,deck.id);renderDeckSelector();rebuildQueue();}function reveal(){if(cardById(currentCardId)){showing=!showing;render();}}function next(){if(!studyQueue.length)return;const i=studyQueue.indexOf(currentCardId);currentCardId=studyQueue[(i+1)%studyQueue.length];showing=false;render();}function previous(){if(!studyQueue.length)return;const i=studyQueue.indexOf(currentCardId);currentCardId=studyQueue[(i-1+studyQueue.length)%studyQueue.length];showing=false;render();}
async function grade(rating){const current=cardById(currentCardId);if(!current||!showing)return;const ratings={1:FsrsRating.Again,2:FsrsRating.Hard,3:FsrsRating.Good,4:FsrsRating.Easy};deckProgress().cards[current.id]=fsrsScheduler.next(schedulerCard(current),new Date(),ratings[rating]).card;deckProgress().updatedAt=Date.now();await saveProgress(deckProgress());showing=false;currentCardId=null;rebuildQueue();}
deckSelect.addEventListener("change",()=>selectDeck(deckSelect.value));cardEl.addEventListener("click",reveal);cardEl.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="Enter"){e.preventDefault();reveal();}});$("nextButton").addEventListener("click",next);$("previousButton").addEventListener("click",previous);gradeButtons.forEach(button=>button.addEventListener("click",()=>grade(Number(button.dataset.grade))));document.addEventListener("keydown",e=>{if(e.target.matches("select,button"))return;if(e.code==="Space"){e.preventDefault();reveal();}if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")previous();});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")rebuildQueue();});window.addEventListener("pageshow",rebuildQueue);
async function init(){try{if(!CONTENT||CONTENT.decks.length!==9)throw new Error("The built-in deck data is invalid.");db=await openDatabase();progressByDeck=new Map((await getAllProgress()).map(item=>[item.deckId,item]));await syncCanonicalContent();const preferred=localStorage.getItem(SELECTED_DECK_KEY);selectDeck(progressByDeck.has(preferred)?preferred:CONTENT.decks[0].id);}catch(error){console.error(error);$("status").textContent="Local storage could not be opened. Please check your browser settings.";}}init();
</script></body></html>
